<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SECTION 9 — ACCESS RECORD 2501</title>
<meta name="description" content="Public Security Section 9 — access record 2501. Fan work by @Poramato3.">
<style>
  :root{
    --cy:#00e5d0; --cy-dim:#0b8f84; --amb:#ff9d2e;
    --ink:#d8fffb; --bg:#04090c; --red:#ff3b52;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,"DejaVu Sans Mono",monospace;
    min-height:100vh; display:flex;
    padding:clamp(12px,3vw,40px); overflow-x:hidden; position:relative;
    -webkit-font-smoothing:antialiased;
  }
  /* ---- CRT overlays ---- */
  body::before{ /* scanlines */
    content:""; position:fixed; inset:0; z-index:9; pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(0,229,208,.055) 0 1px,transparent 1px 4px);
    animation:drift 9s linear infinite;
  }
  body::after{ /* vignette */
    content:""; position:fixed; inset:0; z-index:8; pointer-events:none;
    background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.75) 100%);
  }
  @keyframes drift{to{background-position:0 400px}}

  .plate{
    width:min(1000px,100%); position:relative; z-index:2; margin:auto;
    border:1px solid rgba(0,229,208,.35);
    background:linear-gradient(160deg,rgba(0,229,208,.045),rgba(0,0,0,0) 55%);
    padding:clamp(20px,4vw,52px);
    padding-bottom:clamp(38px,5vw,60px);
    clip-path:polygon(26px 0,100% 0,100% calc(100% - 26px),calc(100% - 26px) 100%,0 100%,0 26px);
    opacity:0; animation:boot .7s ease-out .1s forwards;
  }
  @keyframes boot{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  /* corner brackets */
  .br{position:absolute;width:34px;height:34px;border:2px solid var(--cy);z-index:3}
  .br.tl{top:9px;left:9px;border-right:0;border-bottom:0}
  .br.tr{top:9px;right:9px;border-left:0;border-bottom:0}
  .br.bl{bottom:9px;left:9px;border-right:0;border-top:0}
  .br.brr{bottom:9px;right:9px;border-left:0;border-top:0}

  /* ---- header ---- */
  .head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
  .jp{
    font-size:clamp(30px,6.5vw,54px); color:var(--cy); letter-spacing:.14em;
    line-height:1.1; text-shadow:0 0 18px rgba(0,229,208,.55);
  }
  .jp.glitch{position:relative}
  .jp.glitch::after{
    content:"公安九課"; position:absolute; left:2px; top:0; color:var(--red);
    opacity:.55; mix-blend-mode:screen; clip-path:inset(0 0 62% 0);
    animation:gl 4.2s steps(1) infinite;
  }
  @keyframes gl{
    0%,88%{transform:none;opacity:0}
    89%{transform:translate(-3px,1px);opacity:.6}
    91%{transform:translate(3px,-1px);opacity:.5}
    93%{transform:none;opacity:0}
  }
  .sub{font-size:clamp(11px,2.3vw,17px);letter-spacing:.32em;color:var(--ink);opacity:.9;margin-top:8px}
  .tag{
    border:1px solid rgba(255,157,46,.65); color:var(--amb);
    background:rgba(255,157,46,.11); padding:7px 15px;
    font-size:clamp(10px,2vw,14px); letter-spacing:.28em; white-space:nowrap;
    animation:pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse{50%{box-shadow:0 0 20px rgba(255,157,46,.3)}}

  hr.rule{border:0;border-top:1px solid rgba(0,229,208,.4);margin:22px 0 16px}
  .meta{font-size:clamp(10px,2vw,14px);letter-spacing:.2em;color:var(--cy-dim);margin-bottom:26px}

  /* ---- record rows ---- */
  .row{
    display:grid; grid-template-columns:minmax(120px,190px) 1fr auto;
    gap:6px 18px; align-items:baseline;
    padding:11px 0; border-bottom:1px solid rgba(0,229,208,.14);
    opacity:0; animation:line .45s ease-out forwards;
  }
  @keyframes line{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
  .k{font-size:clamp(10px,1.9vw,13px);letter-spacing:.22em;color:var(--cy-dim)}
  .v{font-size:clamp(15px,3vw,23px);letter-spacing:.05em;color:var(--ink)}
  .n{font-size:clamp(9px,1.7vw,12px);letter-spacing:.14em;color:var(--cy-dim);opacity:.8;text-align:right}
  @media(max-width:620px){
    .row{grid-template-columns:1fr auto}
    .k{grid-column:1/-1}
    .n{text-align:right}
  }
  .bar{display:flex;gap:4px;width:min(240px,42vw)}
  .bar i{flex:1;height:15px;border:1px solid rgba(0,229,208,.55);display:block}
  .bar i.on{background:var(--cy);box-shadow:0 0 9px rgba(0,229,208,.6)}

  /* ---- trace node ---- */
  .node{margin:34px 0 6px}
  .node .k{color:var(--amb);letter-spacing:.3em;display:block;margin-bottom:14px}
  a.trace{
    display:inline-block; color:var(--cy); text-decoration:none;
    font-size:clamp(15px,3.6vw,34px); font-weight:700; letter-spacing:.04em;
    word-break:break-all; line-height:1.25;
    text-shadow:0 0 22px rgba(0,229,208,.5); transition:.25s;
    border-bottom:1px solid rgba(0,229,208,.35); padding-bottom:4px;
  }
  a.trace:hover,a.trace:focus{
    color:#fff; text-shadow:0 0 30px rgba(0,229,208,.95),0 0 60px rgba(0,229,208,.5);
    border-bottom-color:#fff; outline:none;
  }
  .stamp{font-size:clamp(9px,1.8vw,13px);letter-spacing:.2em;color:var(--cy-dim);margin-top:14px}

  /* ---- whisper ---- */
  .whisper{
    margin-top:34px; padding-top:22px; border-top:1px solid rgba(0,229,208,.2);
    font-size:clamp(12px,2.5vw,18px); line-height:1.85; color:var(--cy);
    min-height:4.2em;
  }
  .whisper span{opacity:.92}
  .cursor{display:inline-block;width:.6em;height:1.05em;background:var(--cy);
    vertical-align:-.16em;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  .ticks{display:flex;gap:2px;margin-top:26px;height:19px;align-items:flex-end;overflow:hidden}
  .ticks i{display:block;background:var(--cy)}

  .foot{
    margin-top:20px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
    font-size:clamp(9px,1.7vw,12px);letter-spacing:.16em;color:var(--cy-dim);opacity:.75
  }
  .foot a{color:var(--cy-dim)}
</style>
</head>
<body>
<main class="plate" role="main">
  <span class="br tl"></span><span class="br tr"></span>
  <span class="br bl"></span><span class="br brr"></span>

  <header class="head">
    <div>
      <h1 class="jp glitch">公安九課</h1>
      <div class="sub">PUBLIC SECURITY SECTION 9</div>
    </div>
    <div class="tag">CLASSIFIED</div>
  </header>

  <hr class="rule">
  <div class="meta">ACCESS RECORD // CLEARANCE LEVEL 2501 // EYES ONLY</div>

  <section id="rows"></section>

  <div class="node">
    <span class="k">▶ EXTERNAL TRACE NODE</span>
    <a class="trace" href="https://www.theghostintheshell-anime.jp/" target="_blank" rel="noopener">
      theghostintheshell-anime.jp
    </a>
    <div class="stamp">2026.07.07 — TUE 23:00 JST — ANIMATION BY SCIENCE SARU</div>
  </div>

  <div class="whisper"><span id="type"></span><span class="cursor"></span></div>

  <div class="ticks" id="ticks"></div>

  <div class="foot">
    <span>FAN RECORD / UNOFFICIAL — not affiliated with the rights holders</span>
    <span>ILLUSTRATION @Poramato3</span>
  </div>
</main>

<script>
(function(){
  var rows = [
    ["SUBJECT","攻殻機動隊","ATTACK SHELL SQUAD"],
    ["OPERATOR","草薙素子","MAJOR M. KUSANAGI"],
    ["CASE FILE","2501","PUPPET MASTER / UNRESOLVED"],
    ["GHOST LINE","OPEN","TRACE PERMITTED"],
    ["DIVE","@BAR","84% SYNCHRONIZED"],
    ["ILLUSTRATION","@Poramato3","FAN RECORD / UNOFFICIAL"]
  ];
  var host = document.getElementById('rows');
  var GLYPH = "アイウエオカキクケコサシスセソタチツテナニヌネノ0123456789#%&@*";

  rows.forEach(function(r,i){
    var d = document.createElement('div');
    d.className = 'row';
    d.style.animationDelay = (0.35 + i*0.13) + 's';

    var k = document.createElement('div'); k.className='k'; k.textContent=r[0];
    var v = document.createElement('div'); v.className='v';
    var n = document.createElement('div'); n.className='n'; n.textContent=r[2];

    if(r[1] === '@BAR'){
      var bar = document.createElement('div'); bar.className='bar';
      for(var j=0;j<10;j++){
        var seg=document.createElement('i');
        if(j<8) seg.className='on';
        bar.appendChild(seg);
      }
      v.appendChild(bar);
    } else {
      v.textContent = r[1];
      scramble(v, r[1], 900 + i*130);
    }
    d.appendChild(k); d.appendChild(v); d.appendChild(n);
    host.appendChild(d);
  });

  // ตัวอักษรวิ่งสุ่มก่อนจะ "ถอดรหัส" เป็นข้อความจริง
  function scramble(el, final, delay){
    var steps = 12, i = 0;
    el.textContent = rand(final.length);
    var t = setTimeout(function run(){
      i++;
      if(i >= steps){ el.textContent = final; return; }
      el.textContent = final.slice(0, Math.floor(final.length*i/steps))
                     + rand(final.length - Math.floor(final.length*i/steps));
      setTimeout(run, 45);
    }, delay);
    return t;
  }
  function rand(n){
    var s = '';
    for(var i=0;i<n;i++) s += GLYPH[Math.floor(Math.random()*GLYPH.length)];
    return s;
  }

  // ข้อความปิดท้าย พิมพ์ทีละตัว
  var msg = "If you are reading this, you dove deep enough.\nYour ghost whispers to you.";
  var out = document.getElementById('type'), p = 0;
  setTimeout(function tick(){
    if(p > msg.length) return;
    out.textContent = msg.slice(0,p);
    out.innerHTML = out.textContent.replace(/\n/g,'<br>');
    p++;
    setTimeout(tick, 42);
  }, 2100);

  // แถบบาร์โค้ด
  var tk = document.getElementById('ticks'), w = 0;
  while(w < 1400){
    var b = document.createElement('i');
    var bw = [1,1,2,3,5][Math.floor(Math.random()*5)];
    b.style.width = bw+'px';
    b.style.height = (7 + Math.random()*12)+'px';
    b.style.opacity = (0.25 + Math.random()*0.65).toFixed(2);
    tk.appendChild(b); w += bw + 3;
  }
})();
</script>
</body>
</html>
